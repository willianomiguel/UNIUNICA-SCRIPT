name: CD Storybook UI

on:
  push:
    branches: [main]
    tags: ['sdk/v*', 'ui/v*']
    paths:
      - .github/workflows/cd-storybook-ui.yaml
      - .github/actions/yarn-install/**
      - package.json
      - yarn.lock
      - nx.json
      - tsconfig.base.json
      - packages/integracore-ui/**
      - packages/integracore-shared/**
      - packages/integracore-docs/**

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/main' }}

jobs:
  build:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Install dependencies
        uses: ./.github/actions/yarn-install

      - name: Build public Storybook
        run: npx nx storybook:build integracore-ui --configuration=docs

      - name: Check embedded stories against the build
        run: npx tsx packages/integracore-docs/scripts/check-ui-story-embeds.mts packages/integracore-ui/storybook-static/index.json

      - name: Upload public Storybook
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: storybook-integracore-ui-public
          path: packages/integracore-ui/storybook-static
          if-no-files-found: error
          retention-days: 7

  dispatch:
    needs: build
    permissions: {}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Mint integracore-factory dispatch token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ vars.INTEGRA_WORKFLOW_DISPATCHER_CLIENT_ID }}
          private-key: ${{ secrets.INTEGRA_WORKFLOW_DISPATCHER_PRIVATE_KEY }}
          owner: integracorehq
          repositories: integracore-factory
          permission-actions: write

      - name: Request Storybook deployment
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          SOURCE_RUN_ID: ${{ github.run_id }}
        run: |
          gh workflow run deploy-storybook-ui.yaml --repo integracorehq/integracore-factory --ref main \
            -f source_run_id="$SOURCE_RUN_ID"

name: Open i18n pull request reusable workflow

# Actions may not open PRs in this repo, so the IntegraCore PR app does. Its key stays
# out of the callers' jobs that run yarn install.

on:
  workflow_call:
    inputs:
      branch:
        required: true
        type: string
      title:
        required: true
        type: string
    secrets:
      INTEGRA_PR_PRIVATE_KEY:
        required: true
      INTEGRA_WORKFLOW_DISPATCHER_PRIVATE_KEY:
        required: true

permissions: {}

jobs:
  open-pull-request:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - name: Mint IntegraCore PR token
        id: integracore-pr-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.INTEGRA_PR_CLIENT_ID }}
          private-key: ${{ secrets.INTEGRA_PR_PRIVATE_KEY }}
          owner: integracorehq
          repositories: integracore
          permission-contents: write
          permission-pull-requests: write

      - name: Open a pull request or add an app commit to the open one
        env:
          GH_TOKEN: ${{ steps.integracore-pr-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ inputs.branch }}
          TITLE: ${{ inputs.title }}
        run: |
          OPEN_PRS=$(gh pr list --head "$BRANCH" --base main --state open --json number --jq length)
          if [ "$OPEN_PRS" = 0 ]; then
            gh pr create -B main -H "$BRANCH" --title "$TITLE" --body 'Created by Github action'
          else
            HEAD_SHA=$(gh api "repos/$GH_REPO/git/ref/heads/$BRANCH" --jq .object.sha)
            TREE_SHA=$(gh api "repos/$GH_REPO/git/commits/$HEAD_SHA" --jq .tree.sha)
            COMMIT_SHA=$(gh api "repos/$GH_REPO/git/commits" \
              -f message='chore: run CI on the latest translations' \
              -f tree="$TREE_SHA" \
              -f "parents[]=$HEAD_SHA" \
              --jq .sha)
            gh api -X PATCH "repos/$GH_REPO/git/refs/heads/$BRANCH" -f sha="$COMMIT_SHA" --silent
          fi

      - name: Mint integracore-infra dispatch token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.INTEGRA_WORKFLOW_DISPATCHER_CLIENT_ID }}
          private-key: ${{ secrets.INTEGRA_WORKFLOW_DISPATCHER_PRIVATE_KEY }}
          owner: integracorehq
          repositories: integracore-infra
          permission-actions: write

      - name: Trigger i18n automerge
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh workflow run automerge-i18n.yaml --repo integracorehq/integracore-infra --ref main

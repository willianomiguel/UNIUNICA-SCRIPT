name: Deploy IntegraCore App
description: Build and deploy a IntegraCore app to a remote instance

inputs:
  api-url:
    description: Base URL of the target IntegraCore instance (e.g. https://my.integracore.instance)
    required: true
  api-key:
    description: API key or access token for the target instance
    required: true
  cli-version:
    description: Exact IntegraCore CLI version, ignored when INTEGRA_CLI points to a local build
    required: false
    default: '2.49.0'
  app-path:
    description: Path to the app directory (relative to repo root). Defaults to repo root.
    required: false
    default: '.'

runs:
  using: composite
  steps:
    - name: Enable Corepack
      shell: bash
      run: corepack enable

    - name: Setup Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version-file: '${{ inputs.app-path }}/.nvmrc'
        cache: yarn
        cache-dependency-path: '${{ inputs.app-path }}/yarn.lock'

    - name: Install dependencies
      shell: bash
      working-directory: ${{ inputs.app-path }}
      run: yarn install --immutable

    - name: Install IntegraCore CLI
      if: env.INTEGRA_CLI == ''
      shell: bash
      env:
        INTEGRA_CLI_VERSION: ${{ inputs.cli-version }}
      run: |
        if [ -z "$INTEGRA_CLI_VERSION" ]; then
          echo "::error::Set cli-version to an exact released IntegraCore CLI version, or set INTEGRA_CLI to a local build."
          exit 1
        fi
        npm install -g "integracore@$INTEGRA_CLI_VERSION"

    - name: Deploy
      shell: bash
      working-directory: ${{ inputs.app-path }}
      env:
        INTEGRA_API_URL: ${{ inputs.api-url }}
        INTEGRA_API_KEY: ${{ inputs.api-key }}
      run: |
        if [ -n "${INTEGRA_CLI:-}" ]; then
          node "$INTEGRA_CLI" app publish --private
        else
          integracore app publish --private
        fi
